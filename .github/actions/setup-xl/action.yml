name: Set up xlang
description: >
  Installs the xlang tool `xl` with its install script and, through it, the compiler `xlc` and the standard library
  (`xl lc install`, `xl std install`). Everything after this action speaks `xl`: `xl check`, `xl test`, `xl build`, `xl run`.
  The installs are a download of a few seconds, so they are not cached. Needs the package checked out.

inputs:
  xl-version:
    description: "`xl` release to install (install.sh --version: latest, latest-rc, or a tag)"
    default: "latest"
  xlc-version:
    description: "Compiler release tag for `xl lc install` (empty: the newest)"
    default: ""
  std-version:
    description: "Standard library release tag for `xl std install` (empty: the newest)"
    default: ""

runs:
  using: composite
  steps:
    - name: Install xl
      shell: bash
      env:
        XL_VERSION: ${{ inputs.xl-version }}
      run: |
        curl -fsSL https://github.com/hasirciogluhq/xlang/releases/download/v1.0.0-rc.10/install.sh | bash -s --
        echo "$HOME/.local/bin" >>"$GITHUB_PATH"
    - name: Install the toolchain
      shell: bash
      run: |
        if [ -n "${{ inputs.xlc-version }}" ]; then xl lc install ${{ inputs.xlc-version }}; else xl lc install; fi
        if [ -n "${{ inputs.std-version }}" ]; then xl std install ${{ inputs.std-version }}; else xl std install; fi
        xl version
