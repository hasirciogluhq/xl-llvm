name: ci

# Tests xl-llvm with the xlang tool `xl`:
#   check     type-checks the package for every target
#   features  FEATURES.md and the test files agree
#   unit      the platform independent unit suites (`xl test`), built and run on every host
#   e2e       the platform related tests: they run opt, llc, llvm-as, clang and the programs they produce, on every host
#   consume   a program that imports the package the way an installed dependency is imported
# Also called by the release workflow before a release is published.
#
# The action setup-xl installs `xl` and, through it, the newest compiler and standard library (XLC_VERSION and STD_VERSION pin
# one). LLVM is installed by the action setup-llvm (18 on Linux, the newest release on macOS, the runner's clang plus MSYS2's
# opt and llc on Windows); its package downloads are cached.

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_call:
    inputs:
      xlc_version:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      xlc_version:
        description: "Compiler release tag to use instead of the newest one (optional)"
        type: string
        default: ""
      std_version:
        description: "Standard library release tag to use instead of the newest one (optional)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XLC_VERSION: ${{ inputs.xlc_version }}
  STD_VERSION: ${{ inputs.std_version }}

jobs:
  # The package is pure source: it must type-check for every target, whatever the host is.
  check:
    name: type-check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-xl
      - name: xl check src/index.xl
        run: xl check src/index.xl --target ${{ matrix.target }}
      # The tools layer is OS code: check it (through the e2e program that uses it) for every target too.
      - name: xl check test/e2e/tools.xl
        run: xl check test/e2e/tools.xl --target ${{ matrix.target }}

  features:
    name: features table
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: test/features.sh

  # Unit suites build against the package and run natively on each host. They are platform independent: every host must give the
  # same text, and none of them starts a tool.
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-xl
      # xlc links Mach-O executables with LLVM's `ld64.lld`, ELF ones with `ld.lld`; the runners do not have them.
      - uses: ./.github/actions/setup-llvm
        with:
          tools: lld
      - name: Unit suites
        run: xl test

  # End-to-end tests drive LLVM: verify the printed text, compile and link it, run the program, check the symbol table, run the
  # compile-only legs for every target.
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows e2e is partial: it does not gate a release (see FEATURES.md); the other legs do.
    continue-on-error: ${{ matrix.os == 'windows-2025' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-xl
      - uses: ./.github/actions/setup-llvm
        with:
          tools: all
      - name: End-to-end tests
        run: test/e2e/run.sh

  # An installed package is a directory of source that the compiler gets as a module root: a program that imports it must build
  # and run. xlang.local.toml maps the import name to this checkout (the `[package] root` of its xlang.toml applies); the release
  # workflow repeats this on the packed archive.
  consume:
    name: consume as a package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-xl
      - name: Build and run a program that imports xl-llvm
        run: |
          printf '[modules]\n"xl-llvm" = "."\n' >xlang.local.toml
          xl run test/consume/main.xl
